<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pac-Man</title>
<style>
  body { background:#000; color:#fff; font-family:'Courier New',monospace;
         display:flex; flex-direction:column; align-items:center; margin:0;
         min-height:100vh; justify-content:center; }
  h1 { color:#ffe45c; margin:10px; letter-spacing:6px; font-size:28px; }
  #hud { width:560px; display:flex; justify-content:space-between;
         margin-bottom:8px; font-size:18px; }
  #hud span { color:#ffe45c; }
  canvas { background:#000; border:3px solid #2121c8; border-radius:6px; }
  #msg { margin-top:8px; height:20px; color:#777; font-size:13px; }
</style>
</head>
<body>
<h1>PAC-MAN</h1>
<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div>HIGH <span id="hiscore">0</span></div>
  <div>LIVES <span id="lives">3</span></div>
  <div>LEVEL <span id="level">1</span></div>
</div>
<canvas id="c" width="560" height="620"></canvas>
<div id="msg">ARROWS / WASD move &middot; P pause &middot; M mute</div>

<script>
'use strict';
/* ============================== CONSTANTS ============================== */
const T = 20, COLS = 28, ROWS = 31, TUNNEL_ROW = 27;
const DIRS = { up:{dx:0,dy:-1}, down:{dx:0,dy:1}, left:{dx:-1,dy:0}, right:{dx:1,dy:0} };
const OPP  = { up:'down', down:'up', left:'right', right:'left' };

// # wall   o pellet   O power pellet   . empty
const MAZE = [
"############################",
"#......................#",
"#o%%%%................%%%%o#",
"#o%%%%................%%%%o#",
"#o........................o#",
"#o%%%%..%%........%%..%%%%o#",
"#o%%%%%%%%%%%%%%%%%%%%o#",
"#o........................o#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#......##############......#",
"#......#............#......#",
"#......#............#......#",
"#......................#",
"#O..................O#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#o........................o#",
"#o%%%%................%%%%o#",
"#o%%%%................%%%%o#",
"#o........................o#",
"#o%%%%................%%%%o#",
"#o%%%%................%%%%o#",
"#o........................o#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#o%%%%..%%%%%%%%..%%%%o#",
"#o........................o#",
"..........................",
"#....#................#....#",
"####O#......#..#......O####",
"############################"
];

/* ============================== AUDIO ============================== */
let AC = null, muted = false;
function ac(){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type='square', vol=0.15, delay=0, slideTo=null){
  if (muted) return;
  try {
    const a = ac(), t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
let wakaToggle = false;
const wakaSound    = () => { wakaToggle = !wakaToggle;
  tone(wakaToggle?440:300, .07, 'square', .12, 0, wakaToggle?300:440); };
const powerSound   = () => { tone(500,.45,'sawtooth',.10,0,200); tone(250,.45,'square',.08,0,620); };
const ghostEaten   = () => tone(220,.5,'sawtooth',.15,0,1500);
const pacDeath     = () => { [600,500,400,300,200].forEach((n,i)=>tone(n,.07,'square',.12,i*.1));
                             tone(120,.9,'sawtooth',.18,.55,40); };
const extraLife    = () => [660,880,1100,1320].forEach((n,i)=>tone(n,.1,'square',.12,i*.09));
function playJingle(){
  [523,392,440,494,392,330,294,262,247,262,262,262,392,392,392,392]
    .forEach((n,i)=>tone(n,.13,'square',.10,i*.14));
}
let lastSiren = 0, sirenFlip = false;
function tickSiren(now){
  if (frightTimer > 0 && state === 'playing' && now - lastSiren > 230){
    lastSiren = now; sirenFlip = !sirenFlip;
    tone(sirenFlip?540:300, .18, 'triangle', .09);
  }
}

/* ============================== STATE ============================== */
let grid, pelletsLeft, pac, ghosts, popups;
let score = 0, hiscore = 0, lives = 3, level = 1;
let state = 'ready', stateT = 0, paused = false;
let mode = 'scatter', modeTime = 7, frightTimer = 0;
let elapsed = 0, extraLifeDone = false;

const $ = id => document.getElementById(id);
try { hiscore = +localStorage.getItem('pac_hi') || 0; } catch(e){}

function loadGrid(){
  grid = MAZE.map(r => [...r].map(ch => ch==='#'?1 : ch==='o'?2 : ch==='O'?3 : 0));
  pelletsLeft = 0;
  for (const row of grid) for (const c of row) if (c > 1) pelletsLeft++;
}
function resetPositions(){
  pac = { x:13*T, y:23*T, dir:'left', want:'left', mouth:0 };
  const G = (name,color,corner,x,y,house,rel) =>
    ({ name, color, corner, x, y, dir:'left', state: house?'house':'normal',
       baseY:y, bobT:Math.random()*6, releaseAt:rel });
  ghosts = [
    G('blinky','#ff0044',[25,1], 13*T, 7*T,  false, 0),
    G('pinky', '#ffb8de',[2,1],  13*T,11*T,  true,  2),
    G('inky',  '#00ffff',[25,26],10*T,12*T,  true,  5),
    G('clyde', '#ffb847',[2,26], 16*T,12*T,  true,  9),
  ];
  mode = 'scatter'; modeTime = 7; frightTimer = 0; elapsed = 0;
  popups = [];
}
function newGame(){
  score = 0; lives = 3; level = 1; extraLifeDone = false;
  loadGrid(); resetPositions();
  state = 'ready'; stateT = 0;
  updHUD(); playJingle();
}

/* ============================== MOVEMENT ============================== */
function isWall(tx, ty){
  if (ty < 0 || ty >= ROWS) return true;
  if (tx < 0 || tx >= COLS) return ty !== TUNNEL_ROW;   // tunnel only
  return grid[ty][tx] === 1;
}
function isBlocked(px, py){
  const s = 6;
  return [[px+s,py+10],[px+14,py+10],[px+10,py+s],[px+10,py+14]]
    .some(([x,y]) => isWall(x/T | 0, y/T | 0));
}
const atCenter = e => e.x % T === 0 && e.y % T === 0;
function canGo(e, d){
  const v = DIRS[d];
  return !isWall(e.x/T + v.dx | 0, e.y/T + v.dy | 0);
}
function step(e, sp){
  const v = DIRS[e.dir];
  const nx = e.x + v.dx*sp, ny = e.y + v.dy*sp;
  if (!isBlocked(nx, ny)){
    e.x = nx; e.y = ny;
    if (e.y/T | 0 === TUNNEL_ROW){
      if (e.x < -T) e.x += COLS*T; else if (e.x > COLS*T) e.x -= COLS*T;
    }
  } else {
    e.x = Math.round(e.x/T)*T; e.y = Math.round(e.y/T)*T; e.dir = 'none';
  }
}
const pacSpeed  = () => Math.min(3.4, 2.2 + (level-1)*0.2);
const ghostSpd  = () => Math.min(3.0, 1.9 + (level-1)*0.2);

/* ============================== GHOST AI ============================== */
function ghostTarget(g){
  const px = pac.x/T | 0, py = pac.y/T | 0;
  if (mode === 'scatter') return g.corner;
  switch(g.name){
    case 'blinky': return [px, py];
    case 'pinky':  return [px + DIRS[pac.dir].dx*4, py + DIRS[pac.dir].dy*4];
    case 'inky': {
      const b = ghosts[0], bx = b.x/T | 0, by = b.y/T | 0;
      return [px*2 + (px-bx), py*2 + (py-by)];
    }
    case 'clyde': {
      const d = Math.abs(g.x/T - px) + Math.abs(g.y/T - py);
      return d > 8 ? [px, py] : g.corner;
    }
  }
}
function chooseGhostDir(g){
  let target;
  if (g.state === 'exit') target = [13,13];
  else if (g.state === 'eyes') target = [13,11];
  else target = ghostTarget(g);
  const tx = g.x/T | 0, ty = g.y/T | 0;
  const options = ['up','left','right','down'].filter(d => d !== OPP[g.dir] && canGo(g, d));
  if (!options.length){ g.dir = OPP[g.dir]; return; }
  if (g.state === 'fright'){ g.dir = options[Math.random()*options.length | 0]; return; }
  let best = options[0], bd = Infinity;
  for (const d of options){
    const v = DIRS[d];
    const dist = Math.abs(tx+v.dx - target[0]) + Math.abs(ty+v.dy - target[1]);
    if (dist < bd){ bd = dist; best = d; }
  }
  g.dir = best;
}

/* ============================== UPDATE ============================== */
function addScore(n){
  score += n;
  if (!extraLifeDone && score >= 10000){ lives++; extraLifeDone = true; extraLife(); }
  if (score > hiscore) hiscore = score;
  updHUD();
}
function updHUD(){
  $('score').textContent = score; $('hiscore').textContent = hiscore;
  $('lives').textContent = lives; $('level').textContent = level;
}
function powerUp(){
  frightTimer = Math.max(2, 7 - (level-1));
  ghosts.forEach(g => { if (g.state === 'normal'){ g.dir = OPP[g.dir]; g.state = 'fright'; } });
  powerSound();
}
function updatePac(dt){
  const f = dt*60;
  if (pac.want && atCenter(pac) && canGo(pac, pac.want)) pac.dir = pac.want;
  if (pac.dir === 'none') return;
  step(pac, Math.max(1, Math.round(pacSpeed()*f)));
  pac.mouth += 0.25*f;
  const tx = pac.x/T | 0, ty = pac.y/T | 0, c = grid[ty][tx];
  if (c === 2){ grid[ty][tx] = 0; pelletsLeft--; addScore(10); wakaSound(); }
  else if (c === 3){ grid[ty][tx] = 0; pelletsLeft--; addScore(50); powerUp(); }
  if (pelletsLeft === 0) { state = 'levelclear'; stateT = 0; }
}
function updateGhosts(dt){
  const f = dt*60;
  for (const g of ghosts){
    if (g.state === 'house'){
      g.bobT += 0.1*f; g.y = g.baseY + Math.sin(g.bobT)*3;
      if (elapsed >= g.releaseAt){ g.state = 'exit'; g.y = g.baseY; }
      continue;
    }
    if (atCenter(g)) chooseGhostDir(g);
    const base = g.state === 'eyes' ? 4.5 : g.state === 'fright' ? 1.4 : ghostSpd();
    step(g, Math.max(1, Math.round(base*f)));
    if (g.state === 'exit' && g.x === 13*T && g.y === 13*T)
      g.state = frightTimer > 0 ? 'fright' : 'normal';
    if (g.state === 'eyes' && g.x === 13*T && g.y === 11*T){
      g.x = 13*T; g.y = 12*T; g.baseY = 12*T; g.state = 'house';
      g.releaseAt = elapsed + 2;
    }
  }
}
function checkCollisions(){
  for (const g of ghosts){
    if (g.state === 'house' || g.state === 'exit') continue;
    if ((pac.x-g.x)**2 + (pac.y-g.y)**2 < 144){
      if (g.state === 'fright'){
        const pts = 200 * 2**Math.min(3, popups.length % 4) * (Math.floor(elapsed)%3+1);
        const bonus = [200,400,800,1600][Math.min(3, (score % 7))];
        addScore(bonus);
        popups.push({x:g.x+T/2, y:g.y, text:bonus, t:1});
        g.state = 'eyes';
        ghostEaten();
      } else {
        state = 'dying'; stateT = 0; pacDeath();
      }
    }
  }
}
function updateMode(dt){
  if (frightTimer > 0){
    frightTimer = Math.max(0, frightTimer - dt);
    if (frightTimer === 0) ghosts.forEach(g => { if (g.state==='fright') g.state='normal'; });
    return;
  }
  modeTime -= dt;
  if (modeTime <= 0){
    mode = mode === 'scatter' ? 'chase' : 'scatter';
    modeTime = mode === 'chase' ? 20 : 7;
  }
}
function update(dt){
  stateT += dt;
  if (state === 'ready' && stateT > 2.5) state = 'playing';
  else if (state === 'playing'){
    elapsed += dt;
    updateMode(dt); updatePac(dt); updateGhosts(dt); checkCollisions();
  }
  else if (state === 'levelclear' && stateT > 2){
    level++; loadGrid(); resetPositions();
    state = 'ready'; stateT = 0; updHUD(); playJingle();
  }
  else if (state === 'dying' && stateT > 1.7){
    lives--;
    if (lives <= 0){
      state = 'gameover';
      try { localStorage.setItem('pac_hi', hiscore); } catch(e){}
    } else { resetPositions(); state = 'ready'; stateT = 0; playJingle(); }
    updHUD();
  }
  for (const p of popups){ p.t -= dt; p.y -= 22*dt; }
  popups = popups.filter(p => p.t > 0);
}

/* ============================== DRAW ============================== */
const canvas = $('c'), ctx = canvas.getContext('2d');
function text(s, x, y, color, size){
  ctx.fillStyle = color; ctx.font = 'bold '+size+'px "Courier New",monospace';
  ctx.textAlign = 'center'; ctx.fillText(s, x, y);
}
function drawPac(deathP=false){
  const x = pac.x + T/2, y = pac.y + T/2;
  let a;
  if (deathP) a = (0.1 + 0.9*Math.min(1, stateT/1.2)) * Math.PI;
  else a = (0.15 + 0.25*Math.abs(Math.sin(pac.mouth))) * Math.PI;
  const rot = {up:-Math.PI/2, right:0, down:Math.PI/2, left:Math.PI}[pac.dir] || 0;
  ctx.fillStyle = '#ffe45c';
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.arc(x, y, T/2 - 1, a+rot, 2*Math.PI - a + rot);
  ctx.closePath(); ctx.fill();
}
function drawGhost(g, now){
  const x = g.x + T/2, y = g.y + T/2, r = T/2 - 2;
  if (g.state !== 'eyes'){
    let body = g.color;
    if (g.state === 'fright')
      body = (frightTimer < 2 && Math.floor(now/180) % 2) ? '#ffffff' : '#2121de';
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y-2, r, Math.PI, 0);
    const w = Math.floor(now/140) % 2 ? 0 : 4;
    ctx.lineTo(x+r, y+r); ctx.lineTo(x+r*.5, y+r-w); ctx.lineTo(x, y+r);
    ctx.lineTo(x-r*.5, y+r-w); ctx.lineTo(x-r, y+r);
    ctx.closePath(); ctx.fill();
  }
  const v = DIRS[g.dir] || DIRS.up, ex = v.dx*2, ey = v.dy*2;
  if (g.state === 'fright'){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x-4, y-3, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4, y-3, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(x-6, y+5); ctx.lineTo(x-3, y+3); ctx.lineTo(x, y+5);
    ctx.lineTo(x+3, y+3); ctx.lineTo(x+6, y+5); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x-4, y-3, 3.5, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+4, y-3, 3.5, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2121de';
    ctx.beginPath(); ctx.arc(x-4+ex, y-3+ey, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+4+ex, y-3+ey, 2, 0, 7); ctx.fill();
  }
}
function draw(now){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 560, 620);
  // walls
  ctx.fillStyle = '#1919c8';
  for (let y=0; y<ROWS; y++) for (let x=0; x<COLS; x++)
    if (grid[y][x] === 1) ctx.fillRect(x*T+1, y*T+1, T-2, T-2);
  // pellets
  for (let y=0; y<ROWS; y++) for (let x=0; x<COLS; x++){
    const c = grid[y][x];
    if (c === 2){ ctx.fillStyle = '#ffb897'; ctx.fillRect(x*T+8, y*T+8, 4, 4); }
    else if (c === 3){
      ctx.fillStyle = '#ffb897';
      ctx.beginPath(); ctx.arc(x*T+10, y*T+10, 3 + Math.sin(now/150)*1.5, 0, 7); ctx.fill();
    }
  }
  if (state !== 'gameover'){
    if (state === 'dying') drawPac(true); else drawPac();
    ghosts.forEach(g => drawGhost(g, now));
  }
  // score popups
  for (const p of popups) text(p.text, p.x, p.y, '#00ffff', 14);
  // overlays
  if (state === 'ready')     text('READY!', 280, 270, '#ffe45c', 24);
  if (state === 'levelclear') text('LEVEL CLEAR!', 280, 270, '#00ff88', 24);
  if (state === 'gameover'){
    text('GAME OVER', 280, 280, '#ff0044', 34);
    text('PRESS ENTER TO PLAY AGAIN', 280, 312, '#fff', 14);
  }
  if (paused) text('PAUSED', 280, 310, '#fff', 28);
}

/* ============================== INPUT & LOOP ============================== */
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                 w:'up', s:'down', a:'left', d:'right',
                 W:'up', S:'down', A:'left', D:'right' };
document.addEventListener('keydown', e => {
  if (KEYMAP[e.key]){
    pac.want = KEYMAP[e.key];
    if (state === 'gameover') newGame();
    e.preventDefault();
  }
  else if (e.key === 'p' || e.key === 'P') paused = !paused;
  else if (e.key === 'm' || e.key === 'M'){
    muted = !muted;
    $('msg').textContent = muted ? 'MUTED — press M to unmute'
      : 'ARROWS / WASD move · P pause · M mute';
  }
  else if (e.key === 'Enter' || e.key === ' '){
    if (state === 'gameover') newGame();
    else if (state === 'ready') stateT = 2.5;
    e.preventDefault();
  }
});

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (!paused) update(dt);
  tickSiren(now);
  draw(now);
  requestAnimationFrame(loop);
}
newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
